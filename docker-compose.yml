services:
  ea-edge:
    build:
      context: ea_edge
      dockerfile: Dockerfile
    image: ea-edge
    container_name: ea-edge
    depends_on:
      - ea-app-webui-management
      - ea-app-webui-login
      - ea-app-backend
    ports:
      - 80:80
      - 443:443

  ea-app-webui-management:
    build:
      context: webui/ea_webui_manage
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    image: ea-app-webui-management
    container_name: ea-app-webui-management
  
  ea-app-webui-login:
    build:
      context: webui/ea_webui_login
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL}
    image: ea-app-webui-login
    container_name: ea-app-webui-login

  ea-app-backend:
    build:
      context: ea_backend
      dockerfile: Dockerfile
    image: ea-app-backend
    container_name: ea-app-back
    depends_on:
      - ea-postgres
    environment:
      APP_PORT: 80
      PGSQL_HOST: ea-postgres
      PGSQL_PORT: ${PGSQL_PORT}
      PGSQL_USER: ${PGSQL_USER}
      PGSQL_PASS: ${PGSQL_PASS}
      PGSQL_DB: ${PGSQL_DB}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3030
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
  
  ea-postgres:
    image: postgres:17.2-alpine3.21
    container_name: ea-postgres
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${PGSQL_USER}
      POSTGRES_PASSWORD: ${PGSQL_PASS}
      POSTGRES_DB: ${PGSQL_DB}
    ports:
      - "${PGSQL_PORT}:5432"
