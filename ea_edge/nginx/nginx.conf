worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # gzip（静的UI向け）
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;
    
    upstream ea_webui_login {
        server ea-app-webui-login:80;
    }

    upstream ea_webui_manage {
        server ea-app-webui-management:80;
    }

    upstream backend {
        server ea-app-backend:80;
    }

    server {
        listen 80;
        server_name _;
        location /login/ {
            proxy_http_version 1.1;

            proxy_pass http://ea_webui_login/;
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /app/index.html;
        }

        location /manage/ {
            proxy_http_version 1.1;

            proxy_pass http://ea_webui_manage/;
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /app/index.html;
        }

        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE 対応
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300;
        }

        # ------------------------
        # ルートアクセス制御
        # ------------------------
        location = / {
            return 302 /app/;
        }
    }
}